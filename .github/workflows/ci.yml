# Verificación automática en cada push y cada PR.
#
# Existía `npm run verificar` y nadie lo corría: un script que depende de que
# alguien se acuerde no es una red de seguridad, es una intención.
#
# Qué NO corre acá y por qué: `verificar-constraints` y
# `verificar-campos-personalizados` consultan Neon, y meterle a CI una
# credencial de base para leer un esquema es más superficie de la que ese
# chequeo justifica. Se siguen corriendo a mano antes de un release, junto con
# las migraciones. Ver docs/seguridad.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la corrida anterior: nadie necesita
# el resultado de un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Sale de "engines" en package.json (>=20.9.0). 22 es la LTS actual.
          node-version: 22
          cache: npm

      # `ci` y no `install`: respeta el lockfile exacto en vez de resolverlo de
      # nuevo. Si package-lock.json quedó desincronizado, esto falla acá y no
      # en un deploy.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Valida el polígono de Manrique contra lib/geo/manrique.json. No toca la
      # base, así que corre sin secretos.
      - run: node scripts/verificar-geo.mjs
